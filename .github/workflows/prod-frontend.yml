name: Prod - Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/prod-frontend.yml'
      - '.github/workflows/reusable-frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    name: Frontend - Production
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      environment: prod
      aws-region: eu-central-1
      node-version: '20'
      run-tests: false
    secrets: inherit